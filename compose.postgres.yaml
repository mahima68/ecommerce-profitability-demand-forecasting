services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: retail
      POSTGRES_DB: retail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - retail_pg:/var/lib/postgresql/data
volumes:
  retail_pg:
